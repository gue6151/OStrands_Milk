name: Build OStrands Milk (Skyrim AE)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Get CommonLibSSE-NG (pinned compatible fork)
        shell: pwsh
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/alandtse/CommonLibSSE-NG.git extern/CommonLibSSE-NG
          git -C extern/CommonLibSSE-NG fetch --depth 1 origin 5298302831d03a01b3b406f4b7b8128ee3bd7a44
          git -C extern/CommonLibSSE-NG checkout --detach 5298302831d03a01b3b406f4b7b8128ee3bd7a44

      - name: Get SKSE Menu Framework header
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force extern/SKSEMenuFramework | Out-Null
          Invoke-WebRequest https://raw.githubusercontent.com/QTR-Modding/SKSE-Menu-Framework-3-API/main/SKSEMenuFramework.h -OutFile extern/SKSEMenuFramework/SKSEMenuFramework.h
          if (-not (Test-Path extern/SKSEMenuFramework/SKSEMenuFramework.h)) { throw "SKSEMenuFramework.h not found" }

      - name: Get SimpleIni
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/brofield/simpleini.git _simpleini
          if (-not (Test-Path _simpleini/SimpleIni.h)) { throw "SimpleIni.h not found" }

      - name: Get rapidcsv
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/d99kris/rapidcsv.git rapidcsv
          if (-not (Test-Path rapidcsv/src/rapidcsv.h)) { throw "rapidcsv.h not found" }

      - name: Set up vcpkg
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = "$env:RUNNER_TEMP\vcpkg"
          git clone https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          Add-Content $env:GITHUB_ENV "VCPKG_ROOT=$env:VCPKG_ROOT"

      - name: Install dependencies
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install spdlog:x64-windows fmt:x64-windows directxtk:x64-windows

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 `
            -DENABLE_SKYRIM_SE=OFF `
            -DENABLE_SKYRIM_AE=ON `
            -DENABLE_SKYRIM_VR=OFF `
            -DBUILD_TESTS=OFF `
            -DCOMMONLIB_ENABLE_IPO=OFF `
            -DSIMPLEINI_INCLUDE_DIRS="${{ github.workspace }}/_simpleini" `
            -DRAPIDCSV_INCLUDE_DIRS="${{ github.workspace }}/rapidcsv/src" `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Verify DLL
        shell: pwsh
        run: |
          $dll = Get-ChildItem build -Recurse -Filter OStrands_Milk.dll | Select-Object -First 1
          if (-not $dll) { throw "OStrands_Milk.dll was not produced" }
          Write-Host "DLL found: $($dll.FullName)"

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: OStrands-Milk-Skyrim-AE-1.6.1170
          path: build/**/OStrands_Milk.dll
          if-no-files-found: error
          retention-days: 14
